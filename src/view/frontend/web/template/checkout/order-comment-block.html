<!-- ko if: visible() -->
<div class="order-comments-block comment field">
    <label class="label" for="order-comment" data-bind="text: fieldLabel"></label>
    <div class="control">
        <!-- ko if: isSingleLine -->
        <input
                type="text"
                id="order-comment"
                class="input-text"
                data-bind="
                            value: comment,
                            attr: {
                                maxlength: maxLength,
                                placeholder: fieldPlaceholder
                            }
                        "/>
        <!-- /ko -->

        <!-- ko ifnot: isSingleLine -->
        <textarea
                id="order-comment"
                class="input-text"
                data-bind="
                            value: comment,
                            attr: {
                                rows: lineCount,
                                maxlength: maxLength,
                                placeholder: fieldPlaceholder
                            }
                        "></textarea>
        <!-- /ko -->
    </div>
</div>
<!-- /ko -->
